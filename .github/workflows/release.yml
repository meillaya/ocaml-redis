name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish or refresh as a release (for example v0.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes from tag annotation / commit context
        id: notes
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag_name="${{ inputs.tag }}"
          else
            tag_name="${GITHUB_REF_NAME}"
          fi
          if [ -f CHANGELOG.md ]; then
            notes=$(awk -v tag="$tag_name" '
              BEGIN {
                version=substr(tag,2)
                in_section=0
              }
              $0 ~ "^## \\[" version "\\]" {
                in_section=1
                next
              }
              /^## \[/ && in_section {
                exit
              }
              in_section {
                print
              }
            ' CHANGELOG.md)
          fi

          if [ -z "$notes" ]; then
            notes="Release ${tag_name}"
          fi

          {
            echo 'body<<EOF'
            echo "$notes"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
