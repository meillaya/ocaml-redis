name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ['5.1.1', '5.2.1']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install opam and system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y opam bubblewrap m4 pkg-config

      - name: Cache opam downloads
        uses: actions/cache@v4
        with:
          path: ~/.opam/download-cache
          key: ${{ runner.os }}-opam-download-cache-${{ matrix.ocaml-compiler }}-${{ hashFiles('dune-project', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-opam-download-cache-${{ matrix.ocaml-compiler }}-
            ${{ runner.os }}-opam-download-cache-

      - name: Cache local opam switch
        id: cache-local-switch
        uses: actions/cache@v4
        with:
          path: _opam
          key: ${{ runner.os }}-local-switch-${{ matrix.ocaml-compiler }}-${{ hashFiles('dune-project', '.github/workflows/ci.yml') }}

      - name: Initialize opam
        run: |
          opam init --disable-sandboxing --yes --bare

      - name: Create or reuse local compiler switch
        run: |
          if [ -d _opam ]; then
            echo "Reusing cached local switch for OCaml ${{ matrix.ocaml-compiler }}"
          else
            echo "Creating local switch for OCaml ${{ matrix.ocaml-compiler }} (first run may take several minutes while the compiler builds)"
            opam switch create . ocaml-base-compiler.${{ matrix.ocaml-compiler }} --yes --verbose
          fi
          opam switch .

      - name: Install build tooling
        run: |
          eval "$(opam env --switch=. --set-switch)"
          opam install dune ocamlformat --yes

      - name: Build
        run: |
          eval "$(opam env --switch=. --set-switch)"
          dune build

      - name: Run deterministic test suite
        run: |
          eval "$(opam env --switch=. --set-switch)"
          dune test --display=short

      - name: Run direct test executable
        run: |
          eval "$(opam env --switch=. --set-switch)"
          dune exec test/test_main.exe
